<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Stackly Robotics — the route you requested is no longer responding.">
    <meta name="robots" content="noindex">
    <title>Signal Lost — Stackly Robotics</title>

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.7/dist/gsap.min.js"></script>

    <style>
        /* =========================================================
           404 — SIGNAL LOST
           ========================================================= */

        body {
            padding-top: 0 !important;
        }

        .notfound {
            /* ---- Theme bridge — robotics control-room palette.
                    Local to this section so the page renders correctly
                    regardless of which tokens global.css ships. ---- */
            --signal: #DBFE01;
            --signal-ink: #000000;
            --signal-dim: rgba(219, 254, 1, 0.10);

            --bg-base: #0A0A0A;
            --bg-surface: #111111;
            --bg-elevated: #181818;

            --text-primary: #FFFFFF;
            --text-secondary: rgba(255, 255, 255, 0.68);
            --text-muted: rgba(255, 255, 255, 0.40);

            --line-subtle: #1F1F1F;
            --line-strong: #2A2A2A;

            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);

            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--bg-base);
            color: var(--text-primary);
            overflow: hidden;
        }

        .notfound::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(
                120% 90% at 78% 12%,
                rgba(219, 254, 1, 0.06) 0%,
                transparent 62%
            );
            pointer-events: none;
        }

        /* A faint horizontal scanline grid, echoes control-room HUD */
        .notfound::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 100% 64px;
            pointer-events: none;
            mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 30%, #000 70%, transparent 100%);
        }

        .notfound-inner {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: auto 1fr;
            gap: clamp(40px, 6vw, 80px);
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
            width: 100%;
        }

        /* ---------- Numeral ---------- */

        .notfound-code {
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(110px, 16vw, 240px);
            font-weight: 400;
            line-height: .82;
            letter-spacing: -.06em;
            color: var(--signal);
            opacity: 0.35;
            text-shadow: 0 0 60px rgba(219, 254, 1, 0.25);
            user-select: none;
        }

        /* ---------- Copy ---------- */

        .notfound-copy-col {
            max-width: 620px;
        }

        .notfound .eyebrow {
            color: var(--signal);
        }

        .notfound-title {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 5vw, 72px);
            font-weight: 400;
            line-height: .98;
            letter-spacing: -.05em;
        }

        .notfound-title em {
            color: var(--signal);
            font-style: italic;
        }

        .notfound-text {
            max-width: 500px;
            margin: 28px 0 0;
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.85;
        }

        /* ---------- Actions ---------- */

        .notfound-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 40px;
        }

        /* Local fallbacks so the buttons render correctly even if the
           page loads without the main .btn styles from global.css. */
        .notfound-actions .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 26px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition:
                background 0.3s var(--ease),
                color 0.3s var(--ease),
                border-color 0.3s var(--ease),
                transform 0.3s var(--ease),
                box-shadow 0.3s var(--ease);
        }

        .notfound-actions .btn-light {
            background: var(--signal);
            color: var(--signal-ink);
            border: 1px solid var(--signal);
        }

        .notfound-actions .btn-light:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(219, 254, 1, 0.4);
        }

        .notfound-actions .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--line-strong);
        }

        .notfound-actions .btn-outline:hover {
            background: var(--signal);
            color: var(--signal-ink);
            border-color: var(--signal);
            transform: translateY(-2px);
        }

        /* ---------- Quick links ---------- */

        .notfound-links {
            margin-top: 62px;
            padding-top: 26px;
            border-top: 1px solid var(--line-subtle);
        }

        .notfound-links-label {
            display: block;
            margin-bottom: 18px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .notfound-links-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 28px;
        }

        .notfound-links-row a {
            position: relative;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            transition: color .3s ease;
        }

        .notfound-links-row a::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: -4px;
            left: 0;
            height: 1px;
            background: var(--signal);
            transform: scaleX(0);
            transform-origin: right;
            transition: transform .35s var(--ease);
        }

        .notfound-links-row a:hover {
            color: var(--signal);
        }

        .notfound-links-row a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* ---------- Responsive ---------- */

        @media (max-width: 900px) {
            .notfound-inner {
                grid-template-columns: 1fr;
                gap: 34px;
                justify-items: center;
                text-align: center;
                margin: 0 auto;
                padding: 0 20px;
            }

            .notfound-code {
                font-size: clamp(96px, 26vw, 170px);
            }

            .notfound-actions {
                justify-content: center;
            }

            .notfound-links-row {
                justify-content: center;
            }
        }

        @media (max-width: 820px) {
            .notfound {
                padding: 40px 20px;
            }
        }

        @media (max-width: 560px) {
            .notfound {
                padding: 30px 16px;
            }

            .notfound-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .notfound-actions .btn {
                width: 100%;
            }

            .notfound-links-row {
                gap: 12px 22px;
            }
        }

        /* ---------- Reduced motion ---------- */

        @media (prefers-reduced-motion: reduce) {
            .notfound-actions .btn,
            .notfound-links-row a,
            .notfound-links-row a::after {
                transition: none;
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <main>
        <!-- =================================================
             404 — SIGNAL LOST
             ================================================= -->
        <section class="section notfound" aria-labelledby="notfound-title">
            <div class="container">
                <div class="notfound-inner">

                    <div class="notfound-code" aria-hidden="true">404</div>

                    <div class="notfound-copy-col">
                        <div class="eyebrow">Error / Signal Lost</div>

                        <h1 class="notfound-title" id="notfound-title">
                            This route has<br>been <em>decommissioned.</em>
                        </h1>

                        <p class="notfound-text">
                            The path you requested is no longer responding. It may have been
                            re-indexed, relocated, or never commissioned on this line.
                            Nothing on the floor has stopped — use the links below to
                            return to a live channel.
                        </p>

                        <div class="notfound-actions">
                            <a class="btn btn-light" href="index.html"> Home</a>
                            <button class="btn btn-outline" type="button" id="goBackBtn">Go Back</button>
                        </div>
                    </div>

                </div>
            </div>
        </section>
    </main>


    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

            /* ---------- Entrance ---------- */
            if (!reducedMotion && window.gsap) {
                gsap.timeline({ defaults: { ease: "power4.out" } })
                    .from(".notfound-code", { y: 60, opacity: 0, duration: 1 })
                    .from(".notfound .eyebrow", { x: 30, opacity: 0, duration: .6 }, "-=.7")
                    .from(".notfound-title", { y: 40, opacity: 0, duration: .9 }, "-=.55")
                    .from(".notfound-text", { y: 24, opacity: 0, duration: .7 }, "-=.6")
                    .from(".notfound-actions", { y: 20, opacity: 0, duration: .6 }, "-=.5");
            }

            /* ---------- Retry Signal button ---------- */
            const goBackBtn = document.getElementById("goBackBtn");
            if (goBackBtn) {
                goBackBtn.addEventListener("click", () => {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.location.href = "index.html";
                    }
                });
            }
        });
    </script>
    <!-- Lenis Smooth Scroll Script -->
    <script src="lenis-init.js"></script>
</body>

</html>
